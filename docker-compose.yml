# Local stack: docker compose up, then open http://localhost:3000/intelligence
# Mock mode with the seeded demo workspaces (BRD 21, acceptance scenario 24).
x-app-env: &app-env
  DATABASE_URL: postgres://dmi_app:dmi_app@db:5432/dmi
  DATABASE_MIGRATE_URL: postgres://dmi:dmi@db:5432/dmi
  APP_URL: http://localhost:3000
  APP_BASE_PATH: /intelligence
  JOBS_DATABASE_URL: postgres://dmi_jobs:dmi_jobs@db:5432/dmi
  DATA_MODE: mock
  AUTH_SECRET: local-development-only
  # Local development only. Generate a real one with: openssl rand -base64 32
  TOKEN_ENCRYPTION_KEY: bG9jYWwtZGV2LW9ubHktbm90LWEtcmVhbC1zZWNyZXQ=

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - dmi-db:/var/lib/postgresql/data
      # Creates the dmi, dmi_app and dmi_system roles and the databases on first start.
      - ./db/bootstrap.sql:/docker-entrypoint-initdb.d/01-bootstrap.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dmi"]
      interval: 5s
      timeout: 3s
      retries: 20

  setup:
    build:
      context: .
      target: tools
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  worker:
    build:
      context: .
      target: worker
    environment: *app-env
    depends_on:
      setup:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      target: web
      args:
        APP_BASE_PATH: /intelligence
    environment: *app-env
    ports:
      - "3000:3000"
    depends_on:
      setup:
        condition: service_completed_successfully

volumes:
  dmi-db:
