name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
      DATA_MODE: mock
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Create database roles and databases
        run: psql -h localhost -U postgres -v ON_ERROR_STOP=1 -f db/bootstrap.sql
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit and integration tests
        run: npm test
      - name: Dependency scan (fail on critical)
        run: npm audit --audit-level=critical
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7

  # Acceptance scenario 24: a fresh clone, docker compose up, populated screens and the Mock badge.
  compose:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - name: Build and start the stack
        run: docker compose up -d --build
      - name: Wait for the app (it starts once setup has migrated, seeded and staged the demo)
        run: |
          for i in $(seq 1 120); do
            if curl -fsS http://localhost:3000/intelligence/api/health > /dev/null; then exit 0; fi
            sleep 5
          done
          docker compose ps
          exit 1
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config tests/compose/compose.config.ts
      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color
